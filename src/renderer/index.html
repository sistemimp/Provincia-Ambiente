<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Alex Olivieri" />
    <title>Provincia e Ambiente · Dashboard</title>
    <link rel="icon" href="../img/favicon.ico" />
    <link rel="stylesheet" href="./vendor/coreui.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="card shadow">
            <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
              <img src="../img/logo.png" alt="" height="50" />
              <div><div class="fs-4 fw-semibold">Provincia e Ambiente</div>
              Elaborazione PIMP</div>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <button class="btn btn-primary" id="submit-btn" type="submit" form="pimp-form">
                  <i class="fa-solid fa-play"></i>
                  <i class="fa-sharp fa-regular fa-file-excel"></i>
                </button>
                <button class="btn btn-secondary" id="open-folder" type="button">
                  <i class="fa-solid fa-folder-open btn-icon" aria-hidden="true"></i>
                </button>
                <button class="btn btn-outline-danger" id="truncate-db" type="button">
                  <i class="fa-solid fa-trash btn-icon" aria-hidden="true"></i>
                  <i class="fa-solid fa-database"></i>
                </button>
                <button class="btn btn-outline-primary" id="import-db" type="button">
                  <i class="fa-solid fa-upload"></i>
                  <i class="fa-solid fa-database btn-icon" aria-hidden="true"></i>
                </button>
                <button class="btn btn-outline-dark" id="download-pdf" type="button">
                  <i class="fa-solid fa-download"></i>
                  <i class="fa-solid fa-file-pdf"></i>
                </button>
                <button class="btn btn-outline-secondary btn-sm" id="reset-form" type="button">
                  <i class="fa-solid fa-text-slash"></i>
                </button>
              </div>
            </div>
            <div class="card-body">
              <p class="text-secondary mb-4">Dashboard accessibile senza login per il team Provincia e Ambiente.</p>
              <form id="pimp-form">
                <div class="row mb-4">
                  <div class="col-md-6 mb-3 mb-md-0">
                    <label class="form-label" for="operation">Tipo di lavorazione</label>
                    <select class="form-select" id="operation" name="operation">
                      <option value="PIMP">PIMP (Numero + riferimento)</option>
                      <option value="PIMP-AR">PIMP-AR (solo file con variazioni)</option>
                    </select>
                    <div id="operation-help" class="form-text"></div>
                  </div>
                  <div class="col-md-6 d-flex align-items-end gap-2"></div>
                </div>

                <div class="row mb-3" id="pimp-fields">
                  <div class="col-md-6 mb-3 mb-md-0">
                    <label class="form-label" for="numero">Numero lavorazione (6 cifre)</label>
                    <input
                      class="form-control"
                      id="numero"
                      name="numero"
                      placeholder="123456"
                      maxlength="6"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="cliente">Riferimento cliente (3 cifre)</label>
                    <input
                      class="form-control"
                      id="cliente"
                      name="cliente"
                      placeholder="001"
                      maxlength="3"
                      required
                    />
                  </div>
                </div>
                <div class="row mb-3 d-none" id="barcode-field">
                  <div class="col-md-6">
                    <label class="form-label" for="barcode">Barcode postale iniziale</label>
                    <input
                      class="form-control"
                      id="barcode"
                      name="barcode"
                      placeholder="Inserisci barcode"
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col">
                    <label class="form-label" for="file-input">File di partenza (.xlsx)</label>
                    <input class="form-control" id="file-input" name="file" type="file" accept=".xlsx" />
                  </div>
                </div>

                <div class="row mt-4 d-none" id="status-row">
                  <div class="col">
                    <div class="alert" role="alert" id="status-alert"></div>
                  </div>
                </div>
                <div class="row d-none" id="output-row">
                  <div class="col">
                    <p class="text-muted mb-0" id="output-path"></p>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
